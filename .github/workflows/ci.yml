name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Scheduled runs fuzz for longer than a push does; see the fuzz job.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race run below exercises the same tests; this plain run keeps the
      # result readable and also covers the demo packages.
      - name: Test (no race detector)
        run: go test ./...

      # The demos are example programs, not library code: they are built, never
      # measured. Every other package is in the coverage profile.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v '/demos')

      # 100% statement coverage of the library, with the exceptions recorded in
      # NOCOVER.md. `make cover-check` runs the same check locally.
      - name: Check coverage
        run: sh scripts/covercheck.sh coverage.out NOCOVER.md

      # The demos contain generated files. Regenerating them here keeps the
      # generator and its output in sync: a template change that was not
      # followed by `go generate ./...` fails this step.
      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: Build every package
        run: go build ./...

      # Coverage is generated on every run and only sent on a push: a pull
      # request from a fork has no access to the Coveralls secret.
      - name: Upload coverage to Coveralls
        if: github.event_name != 'pull_request'
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.out
        env:
          # actions-goveralls wraps mattn/goveralls, which reads the Coveralls
          # repository token from COVERALLS_TOKEN. The secret follows Coveralls'
          # own naming convention (COVERALLS_REPO_TOKEN), so map it across.
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  # int and uint use the same 64-bit wire width on every architecture; this job
  # covers the 32-bit build where the range checks live (D6/S6), without the race
  # detector, which 386 does not support.
  test-386:
    name: Test (GOARCH=386)
    runs-on: ubuntu-latest
    env:
      GOARCH: "386"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Test
        run: go test ./...

  # Every target Go supports must build. The wire format is little-endian and no
  # codec assumes a host word size, but only a cross-build proves it: this job
  # compiles every entry of `go tool dist list` and then compiles the test files
  # on a representative cross-section, including big-endian hosts (ppc64, s390x,
  # mips), 32-bit hosts, Windows and both wasm environments.
  portability:
    name: Portability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build and test-compile every target
        run: sh scripts/portable.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --build-tags=fuzz

  # README.md and AGENTS.md are part of the contract. This job verifies every
  # internal link, every documented symbol (through `go doc`), the section
  # numbering, the table of contents and that no retired name survives; see
  # scripts/doccheck.py.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Check documentation
        run: python3 scripts/doccheck.py

  # Fuzz targets live behind the "fuzz" build tag, so `go test ./...` does not
  # run them. Each target gets a short run here; run them longer with
  # `go test -tags=fuzz -run='^$' -fuzz=<target> ./<package>`.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./composite
            target: FuzzString
          - package: ./composite
            target: FuzzByteSlice
          - package: ./composite
            target: FuzzSlice
          - package: ./composite
            target: FuzzMap
          - package: ./composite
            target: FuzzPtr
          - package: ./zerocopy
            target: FuzzString
          - package: ./zerocopy
            target: FuzzByteSlice
          - package: ./zerocopy
            target: FuzzArray
          - package: ./zerocopy
            target: FuzzScalars
          - package: ./scalar
            target: FuzzFixedWidth
          - package: ./scalar
            target: FuzzTime
          - package: ./ptrmap
            target: FuzzPointer
          - package: ./ptrmap
            target: FuzzPointerSlice
          - package: ./typeid
            target: FuzzDTM
          - package: ./typeid
            target: FuzzTyped
          - package: ./varnum
            target: FuzzUnmarshal
          - package: ./wirefmt/varnum
            target: FuzzUnmarshal
          - package: ./wirefmt/varnum
            target: FuzzSkip
          - package: ./wirefmt/composite
            target: FuzzString
          - package: ./wirefmt/composite
            target: FuzzByteSlice
          - package: ./wirefmt/composite
            target: FuzzSlice
          - package: ./wirefmt/composite
            target: FuzzMap
          - package: ./codegen/scanner
            target: FuzzParseDefinedType
          - package: ./codegen/scanner
            target: FuzzParseContainerType
          - package: ./codegen/scanner
            target: FuzzParsePrimitive
          - package: ./codegen/scanner
            target: FuzzScan
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # A push gets a quick smoke run; the nightly schedule runs long enough to
      # explore new inputs.
      - name: Fuzz ${{ matrix.target }}
        run: |
          fuzztime=15s
          if [ "${{ github.event_name }}" = "schedule" ]; then fuzztime=5m; fi
          go test -tags=fuzz -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime="${fuzztime}" -timeout=10m ${{ matrix.package }}

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-386, portability, lint, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
