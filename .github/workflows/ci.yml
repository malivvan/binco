name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Coverage is generated on every run and only sent on a push: a pull
      # request from a fork has no access to the Coveralls secret.
      - name: Upload coverage to Coveralls
        if: github.event_name != 'pull_request'
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.out
        env:
          # actions-goveralls wraps mattn/goveralls, which reads the Coveralls
          # repository token from COVERALLS_TOKEN. The secret follows Coveralls'
          # own naming convention (COVERALLS_REPO_TOKEN), so map it across.
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --build-tags=fuzz

  # Fuzz targets live behind the "fuzz" build tag, so `go test ./...` does not
  # run them. Each target gets a short run here; run them longer with
  # `go test -tags=fuzz -run='^$' -fuzz=<target> ./<package>`.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./wirefmt/varnum
            target: FuzzUnmarshal
          - package: ./wirefmt/varnum
            target: FuzzSkip
          - package: ./wirefmt/composite
            target: FuzzString
          - package: ./wirefmt/composite
            target: FuzzByteSlice
          - package: ./wirefmt/composite
            target: FuzzSlice
          - package: ./wirefmt/composite
            target: FuzzMap
          - package: ./codegen/scanner
            target: FuzzParseDefinedType
          - package: ./codegen/scanner
            target: FuzzParseContainerType
          - package: ./codegen/scanner
            target: FuzzParsePrimitive
          - package: ./codegen/scanner
            target: FuzzScan
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: go test -tags=fuzz -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=15s -timeout=2m ${{ matrix.package }}

      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
